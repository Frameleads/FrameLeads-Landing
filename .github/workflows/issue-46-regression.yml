name: Checkout and VSL first-tap regressions

on:
  pull_request:
    branches:
      - main
      - fix/nextjs-16-4-6-security
    paths:
      - src/components/EmbeddedWhopCheckout.tsx
      - src/components/VideoSection.tsx
      - src/checkout-elements-lifecycle.ts
      - src/vsl-device.ts
      - tests/checkout-elements-lifecycle.test.ts
      - tests/embedded-checkout-policy.test.ts
      - tests/vsl-device-regression.test.ts
      - .github/workflows/issue-46-regression.yml
  push:
    branches:
      - fix/issue-46-lint-regressions-nov13

permissions:
  contents: read

jobs:
  checkout-vsl-regression:
    name: Cancellable checkout initialization and native mobile video tap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Locked dependency install
        run: npm ci --no-fund
      - name: Targeted Whop checkout and mobile VSL regression tests
        run: node --experimental-strip-types --test tests/checkout-elements-lifecycle.test.ts tests/embedded-checkout-policy.test.ts tests/vsl-device-regression.test.ts
