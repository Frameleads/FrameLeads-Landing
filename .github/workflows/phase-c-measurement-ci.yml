name: Phase C landing measurement (isolated)
on:
  push:
    branches: [phase-c/measurement-only-20261101]
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install only locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Consent, event, owner-test and route mock contracts
        run: node --experimental-strip-types --test tests/measurement.test.ts tests/measurement-route.test.ts
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Lint touched files
        run: npx --no-install eslint src/measurement.ts src/components/ProductProofHowItWorks.tsx tests/measurement.test.ts
