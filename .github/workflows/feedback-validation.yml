name: Feedback validation tests

on:
  pull_request:
    paths:
      - 'src/feedback.ts'
      - 'src/feedback-validation.ts'
      - 'src/app/api/feedback/route.ts'
      - 'src/components/FeedbackExperience.tsx'
      - 'tests/feedback-validation.test.ts'
      - '.github/workflows/feedback-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test feedback validation and attribution
        run: node --experimental-strip-types --test tests/feedback-validation.test.ts
