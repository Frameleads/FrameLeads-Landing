name: FrameLeads feedback public release — one-time live smoke
on:
  push:
    branches:
      - test/feedback-public-release-check-20261115
    paths:
      - '.github/workflows/feedback-live-smoke-20261115.yml'

permissions:
  contents: read

concurrency:
  group: feedback-live-smoke-one-time-20261115
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live privacy, checkout, and feedback API before any write
        run: |
          set -euo pipefail
          root="https://frameleads.io"
          privacy_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/fl-privacy.html --write-out '%{http_code}' "$root/privacy")"
          test "$privacy_status" = "200" || { echo "BLOCKED: privacy status HTTP $privacy_status"; exit 1; }
          grep -Fq 'Effective November 15, 2026' /tmp/fl-privacy.html || { echo "BLOCKED: effective privacy date missing"; exit 1; }
          grep -Fq 'not a registered company' /tmp/fl-privacy.html || { echo "BLOCKED: business-status disclosure missing"; exit 1; }
          checkout_status="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$root/checkout/core")"
          test "$checkout_status" = "200" || { echo "BLOCKED: Core checkout status HTTP $checkout_status"; exit 1; }
          homepage_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/fl-home.html --write-out '%{http_code}' "$root/")"
          test "$homepage_status" = "200" || { echo "BLOCKED: homepage status HTTP $homepage_status"; exit 1; }
          grep -Fq 'Feedback' /tmp/fl-home.html || { echo "BLOCKED: public feedback trigger not present"; exit 1; }
          response_code="$(curl --silent --show-error --location --max-time 20 --output /tmp/fl-get.json --write-out '%{http_code}' "$root/api/feedback")"
          test "$response_code" = "405" || { echo "BLOCKED: feedback GET status HTTP $response_code (expected 405)"; exit 1; }
          echo "PASS: Privacy 200 with approved date/identity; Core checkout 200; homepage 200 with feedback UI; GET /api/feedback 405."
      - name: Send one fixed synthetic feedback POST (approved), no retry
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo "BLOCKED: synthetic POST must not run on retry"; exit 1; }
          code="$(curl --silent --show-error --max-time 20 --output /tmp/fl-smoke-response.json --write-out '%{http_code}' \
            --request POST 'https://frameleads.io/api/feedback' \
            --header 'Origin: https://frameleads.io' \
            --header 'Referer: https://frameleads.io/checkout/core' \
            --header 'Sec-Fetch-Site: same-origin' \
            --header 'Content-Type: application/json' \
            --header 'Cache-Control: no-store' \
            --data '{"reason":"offer_clarity","optional_message":"Synthetic public release smoke test fl_public_20261115_6e79bcaf","plan_context":"core"}')"
          if [ "$code" != "201" ]; then
            echo "FAIL: public feedback POST returned HTTP $code (expected 201)."
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const response=JSON.parse(fs.readFileSync("/tmp/fl-smoke-response.json","utf8"));
            if (response.saved!==true) process.exit(1);
          '
          echo "PASS: public feedback POST HTTP 201 with saved=true. Exact synthetic marker fl_public_20261115_6e79bcaf requires privileged readback/cleanup."
