name: One-time Whop Elements lockfile finalization
on:
  push:
    branches:
      - codex/v3-checkout-only-20261026
    paths:
      - .github/workflows/checkout-elements-lock-20261026.yml
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'Frameleads/FrameLeads-Landing' && github.ref == 'refs/heads/codex/v3-checkout-only-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Recreate exact dependency lock and verify
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit only dependency lock
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = "package-lock.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'chore(checkout): lock published Whop Elements 1.9.0 dependencies'
          git push origin HEAD:refs/heads/codex/v3-checkout-only-20261026
