name: Final feedback public-release code validation
on:
  push:
    branches:
      - test/feedback-public-release-check-20261115

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout owner-approved PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact owner-approved source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7a28285e7257699e3f620691661fa820d12a32bf'
          test ! -e src/app/api/feedback-attest-test/route.ts
          test ! -e .github/workflows/feedback-protected-vercel-stage.yml
          grep -Fq 'effectiveDateLabel="Effective November 15, 2026"' src/app/privacy/page.tsx
          grep -Fq 'not a registered company' src/app/privacy/page.tsx
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install exact lockfile dependencies
        run: npm ci --no-fund
      - name: All tests including private feedback
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: High and critical production audit
        run: npm audit --omit=dev --audit-level=high
