name: Affiliate privacy disclosure (draft-only)

on:
  pull_request:
    paths:
      - "src/components/PrivacyChoices.tsx"
      - "src/app/privacy/page.tsx"
      - "tests/affiliate-disclosure-gate.test.mjs"
      - ".github/workflows/affiliate-privacy-disclosure-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without postinstall scripts
        run: npm ci --ignore-scripts
      - name: Verify gated notice and unchanged hosted fallback
        run: node --test tests/affiliate-disclosure-gate.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build (review only, no deployment)
        run: npm run build
