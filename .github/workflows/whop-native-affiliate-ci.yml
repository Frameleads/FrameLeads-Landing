name: Whop-native affiliate signup (Preview only)

on:
  pull_request:
    paths:
      - "src/affiliate-native.ts"
      - "src/affiliate-native-readiness.ts"
      - "src/app/affiliates/**"
      - "src/app/api/affiliates/**"
      - "src/components/AffiliateRegistrationForm.tsx"
      - "src/components/ConfirmAffiliateEmail.tsx"
      - "src/components/AffiliateWalkthrough.tsx"
      - "src/components/WhopReadinessControl.tsx"
      - "tests/affiliate-native-registration.test.ts"
      - "tests/affiliate-walkthrough.test.ts"
      - "tests/affiliate-native-readiness.test.ts"
      - ".github/workflows/whop-native-affiliate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run affiliate policy and provider-mock contracts
        run: node --experimental-strip-types --test tests/affiliate-native-registration.test.ts tests/affiliate-walkthrough.test.ts tests/affiliate-native-readiness.test.ts
      - name: Typecheck all application code
        run: npx --no-install tsc --noEmit
      - name: Lint affiliate implementation
        run: npx --no-install eslint src/affiliate-native.ts src/app/api/affiliates/apply/route.ts src/app/api/affiliates/confirm/route.ts src/app/affiliates/page.tsx src/app/affiliates/confirm/page.tsx src/components/AffiliateRegistrationForm.tsx src/components/ConfirmAffiliateEmail.tsx src/components/AffiliateWalkthrough.tsx src/components/WhopReadinessControl.tsx src/affiliate-native-readiness.ts tests/affiliate-native-registration.test.ts tests/affiliate-walkthrough.test.ts tests/affiliate-native-readiness.test.ts
      - name: Verify isolated Next.js build (no Whop keys)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
