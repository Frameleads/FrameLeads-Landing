name: Embedded checkout verification

on:
  pull_request:
    paths:
      - "src/app/checkout/**"
      - "src/components/EmbeddedWhopCheckout.tsx"
      - "src/components/VerifiedWhopSessionCheckout.tsx"
      - "package.json"
      - "package-lock.json"
      - "src/components/CheckoutOrderSummary.tsx"
      - "src/checkout-embed-policy.ts"
      - "src/checkout-embedded-session.ts"
      - "src/app/api/checkout/route.ts"
      - "tests/checkout-embedded-session.test.ts"
      - "tests/embedded-checkout-policy.test.ts"
      - "tests/browser/checkout-preview.test.mjs"
      - ".github/workflows/embedded-checkout-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Run regression tests
        run: npm test
      - name: Build Next.js
        run: npm run build
      - name: Isolated Chromium checkout smoke (all external requests stubbed)
        run: node --test --test-concurrency=1 tests/browser/checkout-preview.test.mjs
      - name: Upload synthetic checkout screenshots for owner design review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frameleads-checkout-synthetic-layouts
          path: .next/checkout-review/*.png
          if-no-files-found: warn
          retention-days: 7
