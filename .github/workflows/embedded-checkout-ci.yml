name: Embedded checkout verification

on:
  pull_request:
    paths:
      - "src/app/checkout/**"
      - "src/components/EmbeddedWhopCheckout.tsx"
      - "src/checkout-embed-policy.ts"
      - "tests/embedded-checkout-policy.test.ts"
      - ".github/workflows/embedded-checkout-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Run regression tests
        run: npm test
      - name: Build Next.js
        run: npm run build
