name: Reply Decision Preview (isolated review)
on:
  push:
    branches: [feat/reply-decision-preview-20261102]
  pull_request:
    paths:
      - 'src/reply-decision-preview.ts'
      - 'src/components/ReplyDecisionPreview.tsx'
      - 'src/app/reply-decision-preview/page.tsx'
      - 'tests/reply-decision-preview.test.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify preview is ungated and source-constrained
        run: node --test tests/reply-decision-preview.test.mjs
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Lint new preview
        run: npx --no-install eslint src/reply-decision-preview.ts src/components/ReplyDecisionPreview.tsx src/app/reply-decision-preview/page.tsx tests/reply-decision-preview.test.mjs
      - name: Production-style Next.js build (no provider keys)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
