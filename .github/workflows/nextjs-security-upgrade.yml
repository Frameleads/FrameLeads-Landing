name: Next.js security upgrade QA

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - tests/navigation-footer-layout.test.ts
      - tests/pricing-card-glow.test.ts
      - .github/workflows/nextjs-security-upgrade.yml

permissions:
  contents: read

jobs:
  security-qa:
    name: Strict install, tests, build, and dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Strict lockfile installation
        run: npm ci --no-fund
      - name: Verify exact patched runtime dependencies
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const lock = require('./package-lock.json');
          for (const [name, wanted] of [
            ['next','16.4.6'],
            ['eslint-config-next','16.4.6'],
            ['@vercel/oidc','4.0.8'],
          ]) {
            const pinned = p.dependencies?.[name] || p.devDependencies?.[name];
            if (pinned !== wanted || lock.packages['node_modules/'+name]?.version !== wanted) {
              throw Error(name+' not pinned/resolved to the reviewed version '+wanted);
            }
          }
          const zod = lock.packages['node_modules/zod']?.version;
          if (!zod || Number(zod.split('.')[0]) !== 4 ||
              Number(zod.split('.')[1]) < 6 ||
              (Number(zod.split('.')[1]) === 6 && Number(zod.split('.')[2]) < 6)) {
            throw Error('Zod transitive dependency must be patched to >=4.6.6');
          }
          NODE
      - name: TypeScript
        id: types
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm test
      - name: Full ESLint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Production dependency audit (high and critical)
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce every QA gate
        if: always()
        shell: bash
        env:
          TYPES: ${{ steps.types.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          failed=0
          for check in TYPES UNIT LINT BUILD AUDIT; do
            value="${!check}"
            echo "${check}: ${value}"
            if [ "${value}" != "success" ]; then failed=1; fi
          done
          if [ "${failed}" != 0 ]; then
            echo "HOLD: at least one QA gate failed. No merge or production deployment."
          fi
          exit "${failed}"
