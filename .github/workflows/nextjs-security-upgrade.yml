name: Next.js security upgrade (draft)
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/nextjs-security-upgrade.yml

permissions:
  contents: read

concurrency:
  group: nextjs-security-16-4-6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    name: Resolve lockfile without lifecycle scripts
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/nextjs-16-4-6-security' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Regenerate only npm lockfile (no scripts, no secrets)
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Assert pinned manifest and resolved package versions
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const lock = require('./package-lock.json');
          for (const name of ['next','eslint-config-next']) {
            const version = p.dependencies?.[name] || p.devDependencies?.[name];
            if (version !== '16.4.6' || lock.packages['node_modules/'+name]?.version !== '16.4.6') {
              throw Error('Expected patched and pinned '+name+' at 16.4.6 in both manifest and lockfile');
            }
          }
          NODE
      - name: Upload resolved lockfile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextjs-16-4-6-resolved-lock
          path: package-lock.json
          retention-days: 3
          if-no-files-found: error

  update-lockfile-on-isolated-branch:
    name: Commit lockfile only to isolated draft PR branch
    needs: regenerate-lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/nextjs-16-4-6-security
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nextjs-16-4-6-resolved-lock
          path: .
      - name: Check manifest and artifact are in scope
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const lock = require('./package-lock.json');
          for (const name of ['next', 'eslint-config-next']) {
            const wanted = p.dependencies?.[name] || p.devDependencies?.[name];
            if (wanted !== '16.4.6' || lock.packages['node_modules/'+name]?.version !== '16.4.6') {
              throw Error('Refusing to commit unexpected resolved lockfile');
            }
          }
          NODE
      - name: Commit and push only package-lock.json when needed
        shell: bash
        run: |
          set -euo pipefail
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: resolve Next.js 16.4.6 npm lockfile"
          git push origin HEAD:fix/nextjs-16-4-6-security

  verify-upgrade:
    name: Install, test, lint, build, and audit updated lockfile
    needs: update-lockfile-on-isolated-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/nextjs-16-4-6-security
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Strict npm install
        run: npm ci --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Audit production dependencies, high and critical
        run: npm audit --omit=dev --audit-level=high
